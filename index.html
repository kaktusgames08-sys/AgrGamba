<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#130513" />
    <meta name="description" content="Kolo štěstí — roztoč kolo, sbírej Kč, násob výhru a pokračuj díky +SPIN." />
    <title>Kolo štěstí</title>
  </head>
  <body>
    <div id="app">
      <div class="stage-glow stage-glow--left"></div>
      <div class="stage-glow stage-glow--right"></div>
      <div class="starfield" aria-hidden="true"></div>

      <header class="topbar">
        <div class="brand" aria-label="Kolo štěstí">
          <span class="brand__eyebrow">VELKÁ HRA</span>
          <h1>KOLO ŠTĚSTÍ</h1>
          <div class="brand__stars" aria-hidden="true">★ ✦ ★</div>
        </div>

        <div class="hud" aria-live="polite">
          <div class="hud-card hud-card--money">
            <span class="hud-card__label">VÝHRA</span>
            <strong id="moneyCounter">0 Kč</strong>
          </div>
          <div class="hud-card hud-card--spins">
            <span class="hud-card__label">SPINY</span>
            <strong id="spinCounter">1</strong>
          </div>
        </div>

        <div class="top-actions">
          <button id="muteButton" class="icon-button" type="button" aria-label="Vypnout zvuk" title="Zvuk (M)">🔊</button>
          <button id="fullscreenButton" class="icon-button" type="button" aria-label="Celá obrazovka" title="Fullscreen (F)">⛶</button>
        </div>
      </header>

      <main class="game-layout">
        <aside class="history-panel" aria-label="Poslední výsledky">
          <div class="history-panel__title">POSLEDNÍ</div>
          <div id="history" class="history-list">
            <div class="history-empty">Zatím nic</div>
          </div>
        </aside>

        <section class="machine" aria-label="Kolo štěstí">
          <div class="machine__arch machine__arch--back" aria-hidden="true"></div>
          <div class="pointer-wrap" aria-hidden="true">
            <div id="pointer" class="pointer">
              <div class="pointer__cap"></div>
              <div class="pointer__arrow"></div>
            </div>
          </div>

          <div id="wheelShell" class="wheel-shell">
            <div class="bulb-ring" aria-hidden="true"></div>
            <div class="wheel-rim wheel-rim--outer" aria-hidden="true"></div>
            <div class="wheel-rim wheel-rim--inner" aria-hidden="true"></div>
            <div id="wheelMount" class="wheel-mount" aria-label="Herní kolo"></div>

            <div class="center-medallion" aria-hidden="true">
              <span class="center-medallion__small">SPINY</span>
              <strong id="centerSpinCounter">1</strong>
              <span class="center-medallion__small">ZBÝVÁ</span>
            </div>
          </div>

          <div id="resultBurst" class="result-burst" aria-live="assertive">
            <div id="resultMain" class="result-burst__main"></div>
            <div id="resultSub" class="result-burst__sub"></div>
          </div>

          <div class="controls">
            <button id="spinButton" class="spin-button" type="button">
              <span class="spin-button__shine"></span>
              <span class="spin-button__text">ROZTOČIT</span>
              <span class="spin-button__hint">SPACE</span>
            </button>
          </div>

          <div class="key-hints" aria-hidden="true">
            <span><kbd>SPACE</kbd> spin</span>
            <span><kbd>F</kbd> fullscreen</span>
            <span><kbd>M</kbd> zvuk</span>
          </div>
        </section>

        <aside class="prize-panel" aria-label="Pravidla">
          <div class="prize-panel__badge">JAK TO FUNGUJE</div>
          <p>Každé pole kromě <strong>100 Kč</strong> vrací další spin.</p>
          <div class="mini-rule"><span>x2</span> zdvojnásobí výhru</div>
          <div class="mini-rule"><span>x3</span> ztrojnásobí výhru</div>
          <div class="mini-rule mini-rule--final"><span>100</span> finální pole</div>
        </aside>
      </main>

      <div id="overlay" class="final-overlay" aria-hidden="true">
        <div class="final-card">
          <div class="final-card__eyebrow">KONEC KOLA</div>
          <div class="final-card__title">VYHRÁVÁŠ</div>
          <div id="finalAmount" class="final-card__amount">0 Kč</div>
          <div class="final-card__sparkline" aria-hidden="true">✦ ★ ✦ ★ ✦</div>
          <button id="restartButton" class="restart-button" type="button">HRÁT ZNOVU <span>R</span></button>
        </div>
      </div>

      <div id="particleLayer" class="particle-layer" aria-hidden="true"></div>
      <div id="flash" class="screen-flash" aria-hidden="true"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
